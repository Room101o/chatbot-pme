<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chatbot PME — Dashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f4f6f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Top bar ── */
    .topbar {
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      padding: 0 24px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .topbar-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 16px;
      font-weight: 600;
      color: #111;
    }
    .topbar-brand .dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #22c55e;
    }
    .topbar-brand .dot.offline { background: #ef4444; }
    .topbar-status {
      font-size: 12px;
      color: #6b7280;
    }

    /* ── Layout ── */
    .main {
      flex: 1;
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 0;
      height: calc(100vh - 56px);
    }

    /* ── Left: Config panel ── */
    .config-panel {
      background: #fff;
      border-right: 1px solid #e5e7eb;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .config-header {
      padding: 18px 20px 14px;
      border-bottom: 1px solid #f0f0f0;
    }
    .config-header h2 {
      font-size: 14px;
      font-weight: 600;
      color: #111;
      margin-bottom: 2px;
    }
    .config-header p {
      font-size: 12px;
      color: #9ca3af;
    }
    .config-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .field { display: flex; flex-direction: column; gap: 5px; }
    .field label {
      font-size: 12px;
      font-weight: 500;
      color: #374151;
    }
    .field input,
    .field select,
    .field textarea {
      width: 100%;
      padding: 8px 10px;
      font-size: 13px;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      background: #fafafa;
      color: #111;
      outline: none;
      transition: border-color .15s;
      font-family: inherit;
    }
    .field input:focus,
    .field select:focus,
    .field textarea:focus { border-color: #6366f1; background: #fff; }
    .field textarea { resize: vertical; min-height: 72px; line-height: 1.5; }
    .field input[type="password"],
    .field input.mono { font-family: 'Courier New', monospace; font-size: 12px; }

    .api-row { display: flex; gap: 6px; }
    .api-row input { flex: 1; }
    .icon-btn {
      padding: 0 10px;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      background: #fafafa;
      cursor: pointer;
      font-size: 16px;
      color: #6b7280;
      display: flex; align-items: center;
    }
    .icon-btn:hover { background: #f3f4f6; }

    .color-row { display: flex; align-items: center; gap: 10px; }
    .color-preview {
      width: 36px; height: 36px;
      border-radius: 8px;
      border: 1px solid #e5e7eb;
      overflow: hidden;
      flex-shrink: 0;
    }
    .color-preview input[type="color"] {
      width: 52px; height: 52px;
      border: none;
      background: none;
      cursor: pointer;
      margin: -8px;
      padding: 0;
    }
    .color-hex { font-size: 13px; color: #6b7280; font-family: monospace; }

    .divider { height: 1px; background: #f0f0f0; }

    .reset-btn {
      width: 100%;
      padding: 9px;
      font-size: 13px;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      background: #fff;
      cursor: pointer;
      color: #374151;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      transition: background .15s;
    }
    .reset-btn:hover { background: #f9fafb; }

    .config-footer {
      padding: 12px 20px;
      border-top: 1px solid #f0f0f0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-indicator {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #ef4444;
      flex-shrink: 0;
    }
    .status-indicator.ok { background: #22c55e; }
    .status-label { font-size: 12px; color: #6b7280; }

    /* ── Right: Chat panel ── */
    .chat-panel {
      display: flex;
      flex-direction: column;
      background: #f9fafb;
    }
    .chat-topbar {
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .bot-avatar {
      width: 38px; height: 38px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      color: #fff;
      flex-shrink: 0;
    }
    .bot-info .bot-name { font-size: 14px; font-weight: 600; color: #111; }
    .bot-info .bot-online {
      font-size: 11px; color: #22c55e;
      display: flex; align-items: center; gap: 4px;
    }
    .bot-info .bot-online::before {
      content: '';
      width: 6px; height: 6px;
      border-radius: 50%;
      background: currentColor;
      display: inline-block;
    }
    .chat-tag {
      margin-left: auto;
      font-size: 11px;
      background: #f3f4f6;
      color: #6b7280;
      padding: 3px 10px;
      border-radius: 20px;
    }

    .messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg-wrap { display: flex; flex-direction: column; max-width: 72%; }
    .msg-wrap.user { align-self: flex-end; align-items: flex-end; }
    .msg-wrap.bot { align-self: flex-start; align-items: flex-start; }

    .bubble {
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.55;
      word-break: break-word;
    }
    .msg-wrap.bot .bubble {
      background: #fff;
      color: #111;
      border: 1px solid #e5e7eb;
      border-bottom-left-radius: 4px;
    }
    .msg-wrap.user .bubble {
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg-time { font-size: 10px; color: #9ca3af; margin-top: 4px; padding: 0 2px; }

    .typing-bubble {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      border-bottom-left-radius: 4px;
      padding: 12px 16px;
      display: flex; gap: 5px; align-items: center;
      align-self: flex-start;
    }
    .typing-bubble span {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #d1d5db;
      animation: bounce 1.2s infinite;
    }
    .typing-bubble span:nth-child(2) { animation-delay: .2s; }
    .typing-bubble span:nth-child(3) { animation-delay: .4s; }
    @keyframes bounce {
      0%,60%,100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }

    .quick-chips {
      padding: 0 20px 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }
    .chip {
      font-size: 12px;
      padding: 6px 13px;
      border-radius: 20px;
      border: 1px solid #e5e7eb;
      background: #fff;
      cursor: pointer;
      color: #374151;
      transition: all .15s;
    }
    .chip:hover { border-color: #6366f1; color: #6366f1; }

    .chat-footer {
      background: #fff;
      border-top: 1px solid #e5e7eb;
      padding: 12px 16px;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .chat-footer input {
      flex: 1;
      padding: 10px 14px;
      font-size: 14px;
      border: 1px solid #e5e7eb;
      border-radius: 24px;
      outline: none;
      background: #f9fafb;
      transition: border-color .15s;
      font-family: inherit;
    }
    .chat-footer input:focus { border-color: #6366f1; background: #fff; }
    .send-btn {
      width: 40px; height: 40px;
      border-radius: 50%;
      border: none;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: opacity .15s, transform .1s;
    }
    .send-btn:hover { opacity: .88; }
    .send-btn:active { transform: scale(.94); }

    .chat-branding {
      text-align: center;
      font-size: 10px;
      color: #d1d5db;
      padding: 5px 0 8px;
      background: #fff;
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #e5e7eb; border-radius: 4px; }
  </style>
</head>
<body>

<div class="topbar">
  <div class="topbar-brand">
    <span id="topbar-dot" class="dot offline"></span>
    Chatbot PME
  </div>
  <span class="topbar-status" id="topbar-status">Entrez votre clé API pour démarrer</span>
</div>

<div class="main">

  <!-- ── Config panel ── -->
  <div class="config-panel">
    <div class="config-header">
      <h2>⚙️ Configuration</h2>
      <p>Panneau propriétaire — non visible par le client</p>
    </div>
    <div class="config-body">

      <div class="field">
        <label>Clé API Anthropic</label>
        <div class="api-row">
          <input type="password" id="api-key" class="mono" placeholder="sk-ant-api03-..." oninput="updateStatus()" />
          <button class="icon-btn" onclick="toggleKey()" aria-label="Afficher/masquer la clé">👁</button>
        </div>
      </div>

      <div class="divider"></div>

      <div class="field">
        <label>Nom du bot</label>
        <input type="text" id="cfg-botname" value="Assistant Karim" oninput="applyConfig()" />
      </div>

      <div class="field">
        <label>Nom de l'entreprise</label>
        <input type="text" id="cfg-bizname" value="Garage AutoPro" oninput="applyConfig()" />
      </div>

      <div class="field">
        <label>Secteur d'activité</label>
        <select id="cfg-sector" onchange="applyConfig()">
          <option>Automobile / Garage</option>
          <option>Restaurant / Café</option>
          <option>Immobilier</option>
          <option>Cabinet médical</option>
          <option>E-commerce</option>
          <option>Salon de beauté</option>
          <option>Hôtellerie</option>
          <option>Autre</option>
        </select>
      </div>

      <div class="field">
        <label>Message de bienvenue</label>
        <textarea id="cfg-welcome" oninput="applyConfig()">Bonjour ! Je suis l'assistant de Garage AutoPro 🚗 Comment puis-je vous aider ?</textarea>
      </div>

      <div class="field">
        <label>Instructions métier (contexte pour l'IA)</label>
        <textarea id="cfg-instructions" placeholder="Horaires, services, tarifs, adresse...">Ouvert de 8h à 18h du lundi au samedi. Services : vidange, freinage, pneus, révision complète. Pour un devis, demander les coordonnées du client.</textarea>
      </div>

      <div class="field">
        <label>Couleur principale</label>
        <div class="color-row">
          <div class="color-preview" id="color-preview">
            <input type="color" id="cfg-color" value="#6366f1" oninput="applyConfig()" />
          </div>
          <span class="color-hex" id="color-hex">#6366f1</span>
        </div>
      </div>

      <button class="reset-btn" onclick="resetChat()">↺ Réinitialiser la conversation</button>

    </div>
    <div class="config-footer">
      <div class="status-indicator" id="status-dot"></div>
      <span class="status-label" id="status-label">En attente de la clé API...</span>
    </div>
  </div>

  <!-- ── Chat panel ── -->
  <div class="chat-panel">
    <div class="chat-topbar">
      <div class="bot-avatar" id="bot-avatar" style="background:#6366f1">🤖</div>
      <div class="bot-info">
        <div class="bot-name" id="chat-botname">Assistant Karim</div>
        <div class="bot-online">En ligne</div>
      </div>
      <span class="chat-tag">Vue client</span>
    </div>

    <div class="messages" id="messages"></div>

    <div class="quick-chips" id="chips">
      <button class="chip" onclick="sendQuick('Quels sont vos horaires ?')">🕐 Horaires</button>
      <button class="chip" onclick="sendQuick('Quels services proposez-vous ?')">🔧 Services</button>
      <button class="chip" onclick="sendQuick('Comment prendre rendez-vous ?')">📅 Rendez-vous</button>
      <button class="chip" onclick="sendQuick('Quels sont vos tarifs ?')">💰 Tarifs</button>
    </div>

    <div class="chat-footer">
      <input type="text" id="chat-input" placeholder="Écrivez votre message..." onkeydown="if(event.key==='Enter') sendMsg()" />
      <button class="send-btn" id="send-btn" onclick="sendMsg()" aria-label="Envoyer" style="background:#6366f1">➤</button>
    </div>
    <div class="chat-branding">Powered by Claude AI · Chatbot PME</div>
  </div>

</div>

<script>
  let chatHistory = [];
  let isBusy = false;

  function cfg() {
    return {
      apiKey:       document.getElementById('api-key').value.trim(),
      botName:      document.getElementById('cfg-botname').value || 'Assistant',
      bizName:      document.getElementById('cfg-bizname').value || 'Notre entreprise',
      sector:       document.getElementById('cfg-sector').value,
      welcome:      document.getElementById('cfg-welcome').value,
      instructions: document.getElementById('cfg-instructions').value,
      color:        document.getElementById('cfg-color').value
    };
  }

  function applyConfig() {
    const c = cfg();
    document.getElementById('chat-botname').textContent   = c.botName;
    document.getElementById('bot-avatar').style.background = c.color;
    document.getElementById('send-btn').style.background   = c.color;
    document.getElementById('color-preview').style.background = c.color;
    document.getElementById('color-hex').textContent       = c.color;
    updateStatus();
  }

  function updateStatus() {
    const key = document.getElementById('api-key').value.trim();
    const dot  = document.getElementById('status-dot');
    const lbl  = document.getElementById('status-label');
    const tdot = document.getElementById('topbar-dot');
    const tst  = document.getElementById('topbar-status');
    if (key.startsWith('sk-ant')) {
      dot.classList.add('ok');
      lbl.textContent = 'Clé valide — chatbot prêt';
      tdot.classList.remove('offline');
      tst.textContent = 'Chatbot actif';
    } else if (key.length > 0) {
      dot.classList.remove('ok');
      lbl.textContent = 'Format de clé invalide';
      tdot.classList.add('offline');
      tst.textContent = 'Clé API invalide';
    } else {
      dot.classList.remove('ok');
      lbl.textContent = 'En attente de la clé API...';
      tdot.classList.add('offline');
      tst.textContent = 'Entrez votre clé API pour démarrer';
    }
  }

  function toggleKey() {
    const inp = document.getElementById('api-key');
    inp.type = inp.type === 'password' ? 'text' : 'password';
  }

  function nowTime() {
    return new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
  }

  function addMsg(text, type) {
    const area = document.getElementById('messages');
    const wrap = document.createElement('div');
    wrap.className = 'msg-wrap ' + type;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    if (type === 'user') bubble.style.background = cfg().color;
    bubble.innerHTML = text.replace(/\n/g, '<br>');
    const time = document.createElement('div');
    time.className = 'msg-time';
    time.textContent = nowTime();
    wrap.appendChild(bubble);
    wrap.appendChild(time);
    area.appendChild(wrap);
    area.scrollTop = area.scrollHeight;
  }

  function showTyping() {
    const area = document.getElementById('messages');
    const el = document.createElement('div');
    el.id = 'typing';
    el.className = 'typing-bubble';
    el.innerHTML = '<span></span><span></span><span></span>';
    area.appendChild(el);
    area.scrollTop = area.scrollHeight;
  }

  function hideTyping() {
    const el = document.getElementById('typing');
    if (el) el.remove();
  }

  function resetChat() {
    chatHistory = [];
    document.getElementById('messages').innerHTML = '';
    addMsg(cfg().welcome, 'bot');
  }

  async function sendMsg() {
    if (isBusy) return;
    const input = document.getElementById('chat-input');
    const text  = input.value.trim();
    if (!text) return;
    const c = cfg();
    if (!c.apiKey.startsWith('sk-ant')) {
      addMsg('⚠️ Veuillez entrer votre clé API dans le panneau de configuration à gauche.', 'bot');
      return;
    }
    input.value = '';
    addMsg(text, 'user');
    chatHistory.push({ role: 'user', content: text });
    isBusy = true;
    showTyping();
    try {
      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': c.apiKey,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true'
        },
        body: JSON.stringify({
          model: 'claude-sonnet-4-20250514',
          max_tokens: 400,
          system: `Tu es ${c.botName}, assistant virtuel de ${c.bizName} (secteur : ${c.sector}).
${c.instructions ? 'Informations utiles : ' + c.instructions : ''}
Règles importantes :
- Réponds en français ou darija selon la langue du client
- Sois concis et professionnel (max 3 phrases)
- Ne mentionne jamais Claude, Anthropic ou l'IA
- Si tu ne sais pas, propose de contacter l'équipe directement`,
          messages: chatHistory.slice(-12)
        })
      });
      const data = await res.json();
      hideTyping();
      isBusy = false;
      const reply = data.content?.[0]?.text || 'Désolé, une erreur est survenue.';
      addMsg(reply, 'bot');
      chatHistory.push({ role: 'assistant', content: reply });
    } catch (e) {
      hideTyping();
      isBusy = false;
      addMsg('Erreur de connexion. Vérifiez votre clé API et réessayez.', 'bot');
    }
  }

  function sendQuick(text) {
    document.getElementById('chat-input').value = text;
    sendMsg();
  }

  applyConfig();
  resetChat();
</script>
</body>
</html>
